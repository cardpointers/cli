name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          TAR_NAME="cardpointers-${VERSION}.tar.gz"
          tar -czf "$TAR_NAME" cardpointers

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cardpointers
            cardpointers-${{ env.VERSION }}.tar.gz

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI repo
        uses: actions/checkout@v4

      - name: Download release tarball and get SHA
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL_URL="https://github.com/cardpointers/cli/releases/download/v${VERSION}/cardpointers-${VERSION}.tar.gz"
          curl -fsSL "$TARBALL_URL" -o release.tar.gz
          SHA=$(shasum -a 256 release.tar.gz | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: cardpointers/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          cat > homebrew-tap/Formula/cardpointers.rb <<EOF
          class Cardpointers < Formula
            desc "CardPointers CLI — manage your credit card rewards from the terminal"
            homepage "https://cardpointers.com"
            version "$VERSION"
            url "https://github.com/cardpointers/cli/releases/download/v${VERSION}/cardpointers-${VERSION}.tar.gz"
            sha256 "$SHA"
            license "BUSL-1.1"

            depends_on "curl"
            depends_on "jq"

            def install
              bin.install "cardpointers"
            end

            test do
              assert_match "cardpointers", shell_output("\#{bin}/cardpointers --help")
            end
          end
          EOF
          sed -i 's/^          //' homebrew-tap/Formula/cardpointers.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cardpointers.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update cardpointers to v${{ steps.sha.outputs.version }}"
          git push
