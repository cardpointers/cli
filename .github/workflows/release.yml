name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          TAR_NAME="cardpointers-${VERSION}.tar.gz"
          tar -czf "$TAR_NAME" cardpointers

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cardpointers
            cardpointers-${{ env.VERSION }}.tar.gz
