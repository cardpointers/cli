name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI repo
        uses: actions/checkout@v4

      - name: Download release tarball and get SHA
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL_URL="https://github.com/cardpointers/cli/releases/download/v${VERSION}/cardpointers-${VERSION}.tar.gz"
          curl -fsSL "$TARBALL_URL" -o release.tar.gz
          SHA=$(shasum -a 256 release.tar.gz | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: cardpointers/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          cat > homebrew-tap/Formula/cardpointers.rb << EOF
          class Cardpointers < Formula
            desc "CardPointers CLI — manage your credit card rewards from the terminal"
            homepage "https://cardpointers.com"
            version "${VERSION}"
            url "https://github.com/cardpointers/cli/releases/download/v${VERSION}/cardpointers-${VERSION}.tar.gz"
            sha256 "${SHA}"
            license "BUSL-1.1"

            depends_on "curl"
            depends_on "jq"

            def install
              bin.install "cardpointers"
            end

            test do
              assert_match "cardpointers", shell_output("#{bin}/cardpointers --help")
            end
          end
          EOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' homebrew-tap/Formula/cardpointers.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cardpointers.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update cardpointers to v${{ steps.sha.outputs.version }}"
          git push
